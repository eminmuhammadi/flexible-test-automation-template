[pytest]
pythonpath = src src/platform
testpaths = tests
addopts = -ra --slowmo=1000 --alluredir=allure-results --clean-alluredir
markers =
    api: API checks
    browser: browser user-flow checks
    mobile: Appium mobile checks
    smoke: short critical-path checks
    shop: shop domain checks
    regression: broader regression coverage
    test_case(id): unique test case identifier such as TEST-01
